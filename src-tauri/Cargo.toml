[package]
name = "guide-watcher"
default-run = "guide-watcher"
version = "2.0.0"
description = "Generate study guides from lecture PDFs"
authors = ["Guide Watcher contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "guide_watcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
pdf-extract = "0.10"
regex = "1"
same-file = "1"
semver = "1"
png = "0.17"
pulldown-cmark = { version = "=0.13.4", default-features = false }
fontdue = "0.9.4"
notosans = "0.1.0"
sha2 = "0.10"
fs2 = "0.4"
futures = "0.3"
zip = { version = "4", default-features = false, features = ["deflate"] }

rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-single-instance = "2.4.4"
