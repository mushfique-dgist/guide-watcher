name: Release

# Builds Guide Watcher for Windows, macOS (Apple silicon and Intel) and Linux, and attaches the
# installers to a GitHub release.
#
# Signing happens here when the repository holds the credentials, because only a signed build
# avoids the warnings browsers and operating systems show for an unknown publisher:
#
#   Windows   WINDOWS_CERTIFICATE (base64 .pfx) + WINDOWS_CERTIFICATE_PASSWORD
#             optional WINDOWS_TIMESTAMP_URL, default http://timestamp.digicert.com
#   macOS     APPLE_CERTIFICATE (base64 .p12) + APPLE_CERTIFICATE_PASSWORD + APPLE_SIGNING_IDENTITY
#             and, for notarisation, APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID
#   Scanning  VIRUSTOTAL_API_KEY, which uploads every installer and records the report links
#
# Without those secrets the build still succeeds and produces working installers; they are simply
# unsigned, and the release says so. Every artifact gets a build provenance attestation either
# way, which is cryptographic proof of which commit and workflow produced it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v2.1.0"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows
    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}
    # Read at the job level so a step can ask whether a credential exists before using it.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      TAURI_SIGNING_PRIVATE_KEY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev build-essential curl wget file libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: npm ci

      # The app reads its settings at run time, so a runner needs a setup of its own before the
      # suite can exercise the pipeline. It points at the automation folder in this repository
      # and at a scratch study folder, which is exactly the shape a real installation has.
      - name: Point this runner at a study folder of its own
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/study/Photography" "$RUNNER_TEMP/study/Circuit Lab" "$RUNNER_TEMP/study/Scientific Writing"
          mkdir -p "$RUNNER_TEMP/config"
          python - "$RUNNER_TEMP" "$GITHUB_WORKSPACE" <<'PY'
          import json, os, sys
          temp, workspace = sys.argv[1], sys.argv[2]
          settings = {
              "watch_dir": os.path.join(temp, "study").replace("\\", "/"),
              "automation_dir": os.path.join(workspace, "_automation").replace("\\", "/"),
              "archive_dir": "",
              "courses": [
                  {"id": "photography", "label": "Photography", "folder": "Photography"},
                  {"id": "circuit-lab", "label": "Circuit Lab", "folder": "Circuit Lab",
                   "mode": "weekly-lab", "kind": "circuit-lab"},
                  {"id": "scientific-writing", "label": "Scientific Writing", "folder": "Scientific Writing",
                   "mode": "weekly-material", "kind": "scientific-writing-week"},
              ],
              "tools": {},
          }
          with open(os.path.join(temp, "config", "settings.json"), "w", encoding="utf-8") as handle:
              json.dump(settings, handle, indent=2)
          PY
          echo "GUIDE_WATCHER_SETTINGS=$RUNNER_TEMP/config/settings.json" >> "$GITHUB_ENV"

      - name: Install the checker's Python packages
        shell: bash
        run: python -m pip install --quiet pymupdf markdown-it-py requests

      # Run the suite natively: a cross-compiled target cannot execute its own test binaries.
      - name: Check the tests that guard the pipeline
        run: |
          npm run test:frontend
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      # Tauri signs whenever these variables exist at all, so an empty one is worse than none:
      # it signs with an identity of "" and fails. They are exported only when they hold something.
      - name: Import the Apple signing certificate
        if: startsWith(matrix.platform, 'macos') && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            eval "value=\$$name"
            if [ -n "$value" ]; then echo "$name=$value" >> "$GITHUB_ENV"; fi
          done
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          rm certificate.p12

      # Tauri signs Windows bundles during bundling when it is told which installed certificate to
      # use. The certificate is imported here and named by thumbprint directly in this runner's
      # copy of the bundler configuration, which leaves no room for a path to resolve differently.
      - name: Carry the updater signing key when there is one
        if: env.TAURI_SIGNING_PRIVATE_KEY_SECRET != ''
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "TAURI_SIGNING_PRIVATE_KEY=$TAURI_SIGNING_PRIVATE_KEY_SECRET" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"

      - name: Import the Windows signing certificate
        id: windows_signing
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force
          $timestamp = $env:WINDOWS_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestamp)) { $timestamp = "http://timestamp.digicert.com" }
          $path = "src-tauri/tauri.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          if (-not $config.bundle.PSObject.Properties.Name.Contains("windows")) {
            $config.bundle | Add-Member -MemberType NoteProperty -Name windows -Value ([pscustomobject]@{})
          }
          foreach ($pair in @{ certificateThumbprint = $imported.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = $timestamp }.GetEnumerator()) {
            if ($config.bundle.windows.PSObject.Properties.Name.Contains($pair.Key)) {
              $config.bundle.windows.($pair.Key) = $pair.Value
            } else {
              $config.bundle.windows | Add-Member -MemberType NoteProperty -Name $pair.Key -Value $pair.Value
            }
          }
          $config | ConvertTo-Json -Depth 32 | Set-Content -Path $path -Encoding utf8
          Write-Host "signing with certificate $($imported.Thumbprint)"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The signing variables are exported by the steps above, and only when they hold a value.
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Guide Watcher ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # A signature that is missing or broken must be loud, not discovered by whoever downloads it.
      - name: Check that the Windows installers really are signed
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/${{ matrix.target }}/release/bundle"
          $files = Get-ChildItem -Path $bundle -Recurse -Include *.exe, *.msi
          if (-not $files) { throw "no Windows installer was produced" }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($file.Name): $($signature.Status)"
            if ($signature.Status -ne "Valid") { throw "$($file.Name) is not validly signed: $($signature.Status)" }
          }

      - name: Check that the macOS bundles really are signed
        if: startsWith(matrix.platform, 'macos') && env.APPLE_CERTIFICATE != ''
        run: |
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          found=0
          for app in "$bundle"/macos/*.app; do
            [ -e "$app" ] || continue
            found=1
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose "$app" || echo "notarisation is still pending for $app"
          done
          [ "$found" = 1 ] || { echo "no macOS app bundle was produced"; exit 1; }

      - name: Attest what this build produced
        uses: actions/attest-build-provenance@v1
        continue-on-error: true
        with:
          subject-path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb

      - name: Keep the installers for the checksum job
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb

  checksums:
    needs: build
    runs-on: ubuntu-latest
    env:
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: List and hash every installer
        run: |
          find installers -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
            -o -name '*.AppImage' -o -name '*.deb' \) -print0 \
            | xargs -0 -I{} sh -c 'sha256sum "{}" | sed "s|installers/.*/||"' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Every installer is scanned before anyone downloads it, and the report links go on the
      # release, so nobody has to take "it is not a virus" on trust.
      - name: Scan every installer with VirusTotal
        id: virustotal
        if: env.VIRUSTOTAL_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          update_release_body: true
          files: |
            installers/**/*.exe
            installers/**/*.msi
            installers/**/*.dmg
            installers/**/*.AppImage
            installers/**/*.deb

      - name: Attach the checksums to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          files: SHA256SUMS.txt
